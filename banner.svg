<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Darshan Gaviyappa, data and software engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0a2238"/>
      <stop offset="1" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="239" rx="13.5" fill="none" stroke="#1b3550"/>

  <g fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M40 78 V40 H78"/>
    <path d="M40 162 V200 H78"/>
    <path d="M960 78 V40 H922"/>
    <path d="M960 162 V200 H922"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="40" cy="78" r="3"/>
    <circle cx="40" cy="162" r="3"/>
    <circle cx="960" cy="78" r="3" fill="#7c5cff"/>
    <circle cx="960" cy="162" r="3" fill="#7c5cff"/>
  </g>

  <text x="500" y="112" text-anchor="middle" fill="#ffffff" font-size="50" font-weight="800"
        letter-spacing="6" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">DARSHAN GAVIYAPPA</text>
  <text x="500" y="151" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="600"
        letter-spacing="7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">DATA &amp; SOFTWARE ENGINEERING</text>

  <rect x="150" y="170" width="700" height="1.5" fill="url(#rule)"/>
  <circle cy="170.75" r="3" fill="#ffffff" fill-opacity="0.9">
    <animate attributeName="cx" values="150;850;150" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="500" y="200" text-anchor="middle" fill="#7f9bb5" font-size="12.5" letter-spacing="1.6"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Northeastern University  ·  Python  ·  FastAPI  ·  Snowflake  ·  dbt  ·  Airflow  ·  AWS</text>
</svg>
